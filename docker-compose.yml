services:
  vulnerable-target:
    build: ./vulnerable_target
    container_name: vulnerable-target
    environment:
      TARGET_DB_PATH: /data/target.db
    ports:
      - "127.0.0.1:8203:8203"
    volumes:
      - target_data:/data

  red-team:
    build: ./red_team
    container_name: red-team
    environment:
      BLUE_TEAM_URL: http://blue-team:8202
      TARGET_URL: http://vulnerable-target:8203
    ports:
      - "127.0.0.1:8201:8201"
    depends_on:
      - blue-team
      - vulnerable-target

  blue-team:
    build: ./blue_team
    container_name: blue-team
    environment:
      RED_TEAM_URL: http://red-team:8201
      DB_PATH: /data/blue_team.db
    ports:
      - "127.0.0.1:8202:8202"
    volumes:
      - blue_data:/data

volumes:
  blue_data:
  target_data:
